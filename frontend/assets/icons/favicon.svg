<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#06d6a0" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="#030b14" stroke="#00d4ff" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Helix / Biotech Abstract Logo -->
  <g transform="translate(24, 24)" filter="url(#glow)">
    <!-- DNA strands -->
    <path d="M16 10 C 32 10, 48 70, 64 70" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M16 70 C 32 70, 48 10, 64 10" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Connection Bars -->
    <line x1="24" y1="22" x2="24" y2="58" stroke="url(#glowGrad)" stroke-width="3" opacity="0.7" />
    <line x1="40" y1="40" x2="40" y2="40" stroke="url(#glowGrad)" stroke-width="3" opacity="0.7" />
    <line x1="56" y1="58" x2="56" y2="22" stroke="url(#glowGrad)" stroke-width="3" opacity="0.7" />
    
    <!-- Nodes -->
    <circle cx="16" cy="10" r="6" fill="#00d4ff" />
    <circle cx="16" cy="70" r="6" fill="#7c3aed" />
    <circle cx="32" cy="30" r="5" fill="#06d6a0" />
    <circle cx="32" cy="50" r="5" fill="#06d6a0" />
    <circle cx="48" cy="50" r="5" fill="#06d6a0" />
    <circle cx="48" cy="30" r="5" fill="#06d6a0" />
    <circle cx="64" cy="70" r="6" fill="#00d4ff" />
    <circle cx="64" cy="10" r="6" fill="#7c3aed" />
  </g>
</svg>
