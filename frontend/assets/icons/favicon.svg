<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Glowing gradients -->
    <linearGradient id="beakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#06d6a0" />
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background pad -->
  <rect width="128" height="128" rx="36" fill="#030b14" stroke="#00d4ff" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Logo Graphics Group -->
  <g transform="translate(14, 14)" filter="url(#glow)">
    <!-- Scientific Beaker Silhouette -->
    <path d="M 38 12 
             L 62 12 
             L 62 26 
             L 86 78 
             A 8 8 0 0 1 79 88
             L 21 88 
             A 8 8 0 0 1 14 78 
             L 38 26 Z" 
          fill="none" 
          stroke="url(#beakerGrad)" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
          
    <!-- Beaker Lip Rim -->
    <line x1="34" y1="12" x2="66" y2="12" stroke="url(#beakerGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- DNA Helix rising from within the beaker -->
    <!-- Strand 1 -->
    <path d="M 32 80 
             C 42 75, 42 63, 50 58
             C 58 53, 58 41, 50 36
             C 42 31, 42 19, 50 14" 
          fill="none" 
          stroke="url(#dnaGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
          
    <!-- Strand 2 -->
    <path d="M 50 80 
             C 42 75, 42 63, 32 58
             C 22 53, 22 41, 32 36
             C 42 31, 42 19, 32 14" 
          fill="none" 
          stroke="url(#dnaGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          opacity="0.4" />

    <!-- Codon connections inside Beaker -->
    <line x1="35" y1="69" x2="47" y2="69" stroke="url(#dnaGrad)" stroke-width="2" opacity="0.8" />
    <line x1="35" y1="47" x2="47" y2="47" stroke="url(#dnaGrad)" stroke-width="2" opacity="0.8" />
    <line x1="35" y1="25" x2="47" y2="25" stroke="url(#dnaGrad)" stroke-width="2" opacity="0.8" />
  </g>
</svg>
