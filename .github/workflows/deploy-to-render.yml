name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BIOSERVICE_ID: ${{ secrets.RENDER_BIOSERVICE_ID }}
          WORKER_ID: ${{ secrets.RENDER_WORKER_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$BIOSERVICE_ID" ] || [ -z "$WORKER_ID" ]; then
            echo "Missing Render secrets — set RENDER_API_KEY, RENDER_BIOSERVICE_ID, RENDER_WORKER_ID"; exit 1
          fi

          echo "Triggering bioservice deploy..."
          curl -X POST "https://api.render.com/v1/services/$BIOSERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || true

          echo "Triggering worker deploy..."
          curl -X POST "https://api.render.com/v1/services/$WORKER_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || true
