version: '3.9'

services:
  # ── MongoDB Database ─────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: genelab_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (BullMQ Queue Backend) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: genelab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python FastAPI Bioinformatics Service ─────────────────────────────────
  bioservice:
    build:
      context: ./bioservice
      dockerfile: Dockerfile
    container_name: genelab_bioservice
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Express.js Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genelab_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGO_URI: "${MONGO_URI:-mongodb://mongo:27017/genelab}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRY: "${JWT_EXPIRY:-24h}"
      NODE_ENV: "${NODE_ENV:-production}"
      FASTAPI_URL: "http://bioservice:8000"
      REDIS_URL: "redis://redis:6379"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      NCBI_API_KEY: "${NCBI_API_KEY:-}"
      FRONTEND_URL: "${FRONTEND_URL:-*}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      bioservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Worker (BullMQ processors) ───────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: genelab_worker
    restart: unless-stopped
    environment:
      MONGO_URI: "${MONGO_URI:-mongodb://mongo:27017/genelab}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_URL: "redis://redis:6379"
      FASTAPI_URL: "http://bioservice:8000"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      bioservice:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  uploads_data:
